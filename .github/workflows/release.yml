name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      # a PR labeled "auto-release" merges the release PR right away, then re-dispatches
      # because merges made with GITHUB_TOKEN do not trigger a push run
      - name: Release now
        if: github.event_name == 'push' && steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labeled=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[].labels[].name] | index("auto-release") != null')
          [ "$labeled" = true ] || exit 0
          pr=$(gh pr list --label 'autorelease: pending' --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          gh pr merge "$pr" --squash
          gh workflow run release.yml --ref main

  # tags made with GITHUB_TOKEN do not trigger workflows, so publishing lives in this workflow
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: gh release upload "$TAG" dist/cookbook-mcp.js
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
      # npm trusted publishing: no token, provenance comes from the OIDC identity
      - run: pnpm publish --access public --provenance --no-git-checks
