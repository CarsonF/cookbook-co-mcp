version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # every dependency is bundled, so a bump changes what ships
      prefix: deps
    ignore:
      # types follow the oldest supported Node (engines >=22)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
